spring:
  # 1. 데이터베이스 커넥션 설정 (이미지 정보 반영)
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:./db_dev;MODE=MySQL
    username: sa
    password:

  # 2. H2 콘솔 활성화 (웹에서 DB 확인 가능)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # 3. JPA 및 하이버네이트 디버깅 설정
  jpa:
    hibernate:
      ddl-auto: update # 개발 편의를 위해 엔티티 변경 시 테이블 자동 업데이트
    show-sql: true # 콘솔 표준 출력(System.out)으로 SQL 출력
    properties:
      hibernate:
        format_sql: true # SQL을 읽기 좋은 포맷으로 정렬
        highlight_sql: true # SQL 구문에 하이라이팅 색상 적용 (스프링 부트 3.x 이상)
        use_sql_comments: true # 쿼리 생성 원인이 된 주석(내용) 표시

# 4. 쿼리 바인딩 파라미터 및 실행 로그 디버깅 상세 설정
logging:
  level:
    root: info
    # JPA 실행 쿼리와 파라미터 바인딩 값을 로그(slf4j) 레벨에서 추적
    org.hibernate.SQL: trace
    org.hibernate.orm.jdbc.bind: trace # Spring Boot 3.x 파라미터 바인딩 로그
    # org.hibernate.type.descriptor.sql.BasicBinder: trace # Spring Boot 2.x 일 경우 사용
