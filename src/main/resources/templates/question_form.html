<html layout:decorate="~{layout}">
<div layout:fragment="content"
     class="container"
>
    <h5 class="my-3 border-bottom pb-2">
        질문등록
    </h5>

    <form th:action="@{|/question/create|}"
          th:object="${questionFormDto}"
          method="POST"
    >
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>
        <div class="mb-3">
            <label for="subject" class="form-label">
                제목
            </label>
            <input th:field="${questionFormDto.subject}"
                   type="text"
                   class="form-control"
            >
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">
                내용
            </label>
            <textarea th:field="${questionFormDto.content}"
                      class="form-control"
            ></textarea>
        </div>
        <input type="submit"
               value="저장하기"
               class="btn btn-primary my-2"
        >
    </form>
</div>
</html>
